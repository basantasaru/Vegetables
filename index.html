<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vegetables & Fruits Shop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e5700">
  
</head>
<body>


<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
  <div class="search-wrapper">
    <input
      type="text"
      id="searchBar"
      class="search-input"
      placeholder="Search items..."
    >
    <span class="search-icon">🔍</span>
  </div>
  <div id="cartIcon" onclick="toggleCart()" style="margin-left:15px;position:relative;cursor:pointer;font-size:25px;">
    🛒
    <span id="cartCount"
          style="position:absolute;top:-6px;right:-10px;background:red;color:white;
                 border-radius:50%;padding:2px 6px;font-size:12px;">
      0
    </span>
  </div>
</div>




<div class="filter-row">
  <div class="update-info">
    Updated on <b>Monday, Mangsir 29, 09:00AM</b><br>
  </div>

  <select id="priceFilter" onchange="applyPriceFilter()">
    <option value="default">Sort by price</option>
    <option value="low-high">Cheap → Expensive</option>
    <option value="high-low">Expensive → Cheap</option>
  </select>
</div>

<div class="section-title">🥦 🥒 🍅Vegetables🧄 🌶️ 🫑</div>
<div id="vegetablesGrid" class="grid"></div>

<div class="section-title">🍎 🍊 🍌 Fruits 🍋 🥭 🥝</div>
<div id="fruitsGrid" class="grid"></div>

<!-- Floating Cart Panel -->
<div id="cartPanel">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <span class="close-btn" onclick="closeCart()">×</span>
  </div>
  <ul id="cartItems"></ul>
  <div id="cartTotal"><b>Total: Rs. 0</b></div>
</div>

<!-- Quantity Selector Modal -->
<div id="qtyModal" class="modal">
  <div class="modal-box">

    <span class="close-btn" onclick="closeQtyModal()">×</span>

    <h3 id="modalItemName">Item</h3>
    <p id="modalPricePerKg">Rs 0 / kg</p>

    <!-- Manual Input -->
    <input
      type="number"
      id="gramInput"
      placeholder="Enter grams (e.g. 250)"
    />

    <!-- Quick Quantity Buttons -->
    <div class="qty-btns">
      <button onclick="selectQty(250)">250g</button>
      <button onclick="selectQty(500)">500g</button>
      <button onclick="selectQty(750)">750g</button>
      <button onclick="selectQty(1000)">1kg</button>
      <button onclick="selectQty(1500)">1.5kg</button>
      <button onclick="selectQty(2000)">2kg</button>
      <button onclick="selectQty(2500)">2.5kg</button>
      <button onclick="selectQty(3000)">3kg</button>
      <button onclick="selectQty(4000)">4kg</button>
    </div>

    <div id="finalPrice">Total: Rs 0</div>

    <button class="add-btn" onclick="confirmAddToCart()">
      Add to Cart
    </button>

  </div>
</div>

<footer class="brand-footer">
  <p>
   🙋 Built by 
    <a href="https://basantasaru.github.io" target="_blank">
      👇<u>Basantasaru.github.io</u>
    </a>
  </p>
</footer>


</body>
<script src="script.js"></script>
</html>
